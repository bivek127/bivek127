<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#1a0933"/>
      <stop offset="100%" stop-color="#0a0020"/>
    </linearGradient>

    <filter id="megaGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#ff00ff" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#00ffff" flood-opacity="0.9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="redGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ff0066" flood-opacity="0.9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="wildGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ff">
        <animate attributeName="stop-color" values="#ff00ff;#00ffff;#ff0066;#00ff00;#ff00ff" dur="2.02s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00ffff">
        <animate attributeName="stop-color" values="#00ffff;#ff0066;#00ff00;#ff00ff;#00ffff" dur="2.02s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff0066">
        <animate attributeName="stop-color" values="#ff0066;#00ff00;#ff00ff;#00ffff;#ff0066" dur="2.02s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="explosion" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="crazygrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff00ff" stroke-width="0.8" opacity="0.3"/>
      <circle cx="0" cy="0" r="2" fill="#00ffff" opacity="0.4"/>
    </pattern>

    <filter id="glitch">
      <feTurbulence baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  
  <rect width="1200" height="320" fill="url(#crazygrid)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.52s" repeatCount="indefinite"/>
  </rect>

  <!-- EXPLOSION CIRCLES -->
  <circle cx="600" cy="160" r="50" fill="url(#explosion)" opacity="0">
    <animate attributeName="r" values="0;200;0" dur="3.03s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="3.03s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="160" r="50" fill="url(#explosion)" opacity="0">
    <animate attributeName="r" values="0;200;0" dur="3.03s" begin="1.52s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="3.03s" begin="1.52s" repeatCount="indefinite"/>
  </circle>

  <!-- CRAZY PARTICLES -->
  <circle cx="100" cy="50" r="4" fill="#ff00ff" opacity="0.79" filter="url(#megaGlow)">
    <animate attributeName="cy" values="50;270;50" dur="3.03s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="100;200;100" dur="3.03s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;8;4" dur="3.03s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="270" r="5" fill="#00ffff" opacity="0.79" filter="url(#cyanGlow)">
    <animate attributeName="cy" values="270;50;270" dur="4.04s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1100;1000;1100" dur="4.04s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;10;5" dur="4.04s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="150" r="6" fill="#ff0066" opacity="0.79" filter="url(#redGlow)">
    <animate attributeName="cy" values="150;200;150" dur="2.02s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="300;400;300" dur="2.02s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;12;6" dur="2.02s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="100" r="4" fill="#00ff00" opacity="0.79">
    <animate attributeName="cy" values="100;250;100" dur="3.54s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="900;800;900" dur="3.54s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="280" r="5" fill="#ff00ff" opacity="0.79">
    <animate attributeName="cy" values="280;40;280" dur="4.55s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;15;5" dur="4.55s" repeatCount="indefinite"/>
  </circle>

  <!-- LIGHTNING BOLTS -->
  <path d="M 0 160 L 1200 160" stroke="url(#wildGrad)" stroke-width="3" opacity="0.59" stroke-linecap="round">
    <animate attributeName="d" values="M 0 160 L 1200 160; M 0 140 L 1200 180; M 0 160 L 1200 160" dur="0.30s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.30s" repeatCount="indefinite"/>
  </path>

  <!-- FAST STREAKS -->
  <line x1="-200" y1="50" x2="100" y2="50" stroke="#ff00ff" stroke-width="4" opacity="0.79" stroke-linecap="round">
    <animate attributeName="x1" values="-200;1200" dur="1.01s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100;1500" dur="1.01s" repeatCount="indefinite"/>
  </line>
  <line x1="-200" y1="270" x2="100" y2="270" stroke="#00ffff" stroke-width="4" opacity="0.79" stroke-linecap="round">
    <animate attributeName="x1" values="-200;1200" dur="1.21s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100;1500" dur="1.21s" repeatCount="indefinite"/>
  </line>
  <line x1="-200" y1="150" x2="100" y2="150" stroke="#ff0066" stroke-width="4" opacity="0.79" stroke-linecap="round">
    <animate attributeName="x1" values="-200;1200" dur="0.81s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100;1500" dur="0.81s" repeatCount="indefinite"/>
  </line>

  <!-- DIAGONAL MADNESS -->
  <line x1="0" y1="0" x2="1200" y2="320" stroke="url(#wildGrad)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.79;0" dur="0.51s" repeatCount="indefinite"/>
  </line>
  <line x1="1200" y1="0" x2="0" y2="320" stroke="url(#wildGrad)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.79;0" dur="0.61s" repeatCount="indefinite"/>
  </line>

  <!-- GLITCH NAME LAYERS -->
  <text x="604" y="144" text-anchor="middle" font-size="72" letter-spacing="6" font-family="'JetBrains Mono', 'Courier New', monospace" fill="#ff0066" opacity="0.4" font-weight="bold">BIVEK</text>
  <text x="596" y="136" text-anchor="middle" font-size="72" letter-spacing="6" font-family="'JetBrains Mono', 'Courier New', monospace" fill="#00ffff" opacity="0.4" font-weight="bold">BIVEK</text>
  
  <!-- MAIN NAME -->
  <text x="600" y="140" text-anchor="middle" font-size="72" letter-spacing="6" font-family="'JetBrains Mono', 'Courier New', monospace" fill="url(#wildGrad)" filter="url(#megaGlow)" font-weight="bold">
    BIVEK
    <animate attributeName="opacity" values="1;0.7;1" dur="0.30s" repeatCount="indefinite"/>
  </text>
  
  <!-- CRAZY GLITCH EFFECT -->
  <text x="600" y="140" text-anchor="middle" font-size="72" letter-spacing="6" font-family="'JetBrains Mono', 'Courier New', monospace" fill="#00ff00" opacity="0" font-weight="bold">
    BIVEK
    <animate attributeName="opacity" values="0;0.79;0;0.59;0;0.89;0" dur="0.20s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;605;595;600;608;592;600" dur="0.20s" repeatCount="indefinite"/>
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="180" text-anchor="middle" font-size="15" letter-spacing="3" font-family="'JetBrains Mono', 'Courier New', monospace" fill="#ffffff" filter="url(#cyanGlow)">
    SOFTWARE DEVELOPMENT · MACHINE LEARNING · SYSTEM DESIGN
    <animate attributeName="fill" values="#ffffff;#ff00ff;#00ffff;#ffffff" dur="3.03s" repeatCount="indefinite"/>
  </text>

  <!-- EMAIL SECTION -->
  <g>
    <!-- Email icon with glow -->
    <rect x="440" y="205" width="22" height="16" rx="2" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.7" filter="url(#megaGlow)">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3.03s" repeatCount="indefinite"/>
    </rect>
    <path d="M 440 205 L 451 214 L 462 205" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.7" filter="url(#megaGlow)">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3.03s" repeatCount="indefinite"/>
    </path>
    
    <!-- Email text -->
    <text x="475" y="219" font-size="16" letter-spacing="2" 
          font-family="'JetBrains Mono', 'Courier New', monospace" fill="#00ffff" 
          filter="url(#cyanGlow)" font-weight="600">
      bivekmb127@gmail.com
      <animate attributeName="fill" values="#00ffff;#ff00ff;#00ffff" dur="4.04s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- INSANE UNDERLINES -->
  <line x1="250" y1="235" x2="950" y2="235" stroke="#ff00ff" stroke-width="3" opacity="0.89" filter="url(#megaGlow)">
    <animate attributeName="stroke" values="#ff00ff;#00ffff;#ff0066;#00ff00;#ff00ff" dur="2.02s" repeatCount="indefinite"/>
  </line>
  
  <line x1="250" y1="238" x2="450" y2="238" stroke="#00ffff" stroke-width="5" opacity="0.99" stroke-linecap="round">
    <animate attributeName="x1" values="250;950" dur="1.52s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="450;1150" dur="1.52s" repeatCount="indefinite"/>
  </line>

  <!-- CORNER EXPLOSIONS -->
  <polygon points="200,130 210,120 230,120 240,130 230,140 210,140" fill="none" stroke="url(#wildGrad)" stroke-width="3" opacity="0.79">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.01s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 220 130;360 220 130" dur="3.03s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="1.01s" repeatCount="indefinite" additive="sum"/>
  </polygon>
  <polygon points="960,130 970,120 990,120 1000,130 990,140 970,140" fill="none" stroke="url(#wildGrad)" stroke-width="3" opacity="0.79">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.21s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 980 130;-360 980 130" dur="3.03s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="1.21s" repeatCount="indefinite" additive="sum"/>
  </polygon>

  <!-- CIRCUIT CHAOS -->
  <path d="M 50 280 L 150 280 L 150 250 L 200 250" stroke="#ff00ff" stroke-width="2" opacity="0.59" fill="none">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="0.81s" repeatCount="indefinite"/>
  </path>
  <circle cx="200" cy="250" r="5" fill="#ff00ff" opacity="0.99">
    <animate attributeName="r" values="3;8;3" dur="0.81s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.81s" repeatCount="indefinite"/>
  </circle>
  
  <path d="M 1150 280 L 1050 280 L 1050 250 L 1000 250" stroke="#00ffff" stroke-width="2" opacity="0.59" fill="none">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.01s" repeatCount="indefinite"/>
  </path>
  <circle cx="1000" cy="250" r="5" fill="#00ffff" opacity="0.99">
    <animate attributeName="r" values="3;8;3" dur="1.01s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.01s" repeatCount="indefinite"/>
  </circle>

  <!-- RANDOM FLASHING SQUARES -->
  <rect x="100" y="90" width="15" height="15" fill="#ff00ff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.30s" repeatCount="indefinite"/>
  </rect>
  <rect x="1080" y="190" width="15" height="15" fill="#00ffff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.40s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="190" width="15" height="15" fill="#ff0066" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.51s" repeatCount="indefinite"/>
  </rect>

  <!-- SCANNING LINES -->
  <rect x="0" y="0" width="1200" height="4" fill="#ff00ff" opacity="0.49">
    <animate attributeName="y" values="-10;320" dur="2.02s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="4" fill="#00ffff" opacity="0.49">
    <animate attributeName="y" values="320;-10" dur="2.53s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative brackets around email -->
  <path d="M 420 195 L 410 195 L 410 230 L 420 230" stroke="#ff006e" stroke-width="2" fill="none" opacity="0.59">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.04s" repeatCount="indefinite"/>
  </path>
  <path d="M 780 195 L 790 195 L 790 230 L 780 230" stroke="#ff006e" stroke-width="2" fill="none" opacity="0.59">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.04s" begin="0.51s" repeatCount="indefinite"/>
  </path>
</svg>